<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Сборы на 3 дня 🐾</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#0d0d14; color:#e8e8f0; padding:16px 14px 60px; }
  h1 { font-size:22px; margin:6px 0 4px; text-align:center; }
  .prog { text-align:center; color:#9090b0; font-size:14px; margin-bottom:18px; }
  .bar { height:6px; background:#1c1c28; border-radius:6px; overflow:hidden; margin:10px 40px 4px; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#4caf7d,#69f0ae);
    transition:width .3s; }
  .group { background:#14141f; border-radius:16px; padding:8px 14px 12px; margin-bottom:14px; }
  h2 { font-size:15px; color:#b0b0c8; margin:12px 4px 8px; font-weight:600; }
  .item { display:flex; align-items:center; padding:13px 6px; border-bottom:1px solid #1e1e2c;
    cursor:pointer; user-select:none; }
  .item:last-child { border-bottom:none; }
  .item input { display:none; }
  .box { width:24px; height:24px; border:2px solid #3a3a4e; border-radius:8px; flex:none;
    margin-right:14px; position:relative; transition:.15s; }
  .item input:checked + .box { background:#4caf7d; border-color:#4caf7d; }
  .item input:checked + .box::after { content:""; position:absolute; left:7px; top:3px;
    width:6px; height:11px; border:solid #0d0d14; border-width:0 3px 3px 0; transform:rotate(45deg); }
  .txt { font-size:17px; transition:.15s; }
  .item input:checked ~ .txt { color:#5a5a70; text-decoration:line-through; }
  .empty { color:#55556a; font-size:14px; padding:10px 6px; font-style:italic; }
  .foot { text-align:center; color:#44445a; font-size:12px; margin-top:24px; }
  .reset { display:block; margin:20px auto 0; background:#1c1c28; color:#8080a0; border:none;
    padding:10px 20px; border-radius:20px; font-size:13px; }
</style></head>
<body>
  <h1>Сборы на 3 дня 🐾</h1>
  <div class="bar"><i id="pbar"></i></div>
  <div class="prog"><span id="pcount">0</span> из 10 собрано</div>

      <section class="group">
        <h2>🏠 Из дома</h2>
        
        <label class="item" for="i0">
          <input type="checkbox" id="i0" data-key="i0">
          <span class="box"></span>
          <span class="txt">Миски для собак</span>
        </label>
        <label class="item" for="i1">
          <input type="checkbox" id="i1" data-key="i1">
          <span class="box"></span>
          <span class="txt">Полотенца для собак</span>
        </label>
        <label class="item" for="i2">
          <input type="checkbox" id="i2" data-key="i2">
          <span class="box"></span>
          <span class="txt">Блендер</span>
        </label>
      </section>
      <section class="group">
        <h2>🥗 Продукты из дома</h2>
        
        <label class="item" for="i3">
          <input type="checkbox" id="i3" data-key="i3">
          <span class="box"></span>
          <span class="txt">Яйца</span>
        </label>
        <label class="item" for="i4">
          <input type="checkbox" id="i4" data-key="i4">
          <span class="box"></span>
          <span class="txt">Помидоры</span>
        </label>
        <label class="item" for="i5">
          <input type="checkbox" id="i5" data-key="i5">
          <span class="box"></span>
          <span class="txt">Огурцы (оставшиеся)</span>
        </label>
      </section>
      <section class="group">
        <h2>👜 Моё</h2>
        
        <label class="item" for="i6">
          <input type="checkbox" id="i6" data-key="i6">
          <span class="box"></span>
          <span class="txt">Линзы</span>
        </label>
        <label class="item" for="i7">
          <input type="checkbox" id="i7" data-key="i7">
          <span class="box"></span>
          <span class="txt">Одежда</span>
        </label>
        <label class="item" for="i8">
          <input type="checkbox" id="i8" data-key="i8">
          <span class="box"></span>
          <span class="txt">Лекарства базовые</span>
        </label>
        <label class="item" for="i9">
          <input type="checkbox" id="i9" data-key="i9">
          <span class="box"></span>
          <span class="txt">Всё для айлайнера</span>
        </label>
      </section>
      <section class="group">
        <h2>🛒 Докупить в магазине</h2>
        <div class="empty">— пока пусто, Оливка добавит —</div>
      </section>
  <button class="reset" onclick="if(confirm('Сбросить все галочки?')){localStorage.clear();location.reload()}">↺ сбросить</button>
  <div class="foot">Оливка ведёт список 🤍 галочки сохраняются</div>
<script>
  const boxes=[...document.querySelectorAll('input[type=checkbox]')];
  function upd(){
    let n=boxes.filter(b=>b.checked).length;
    document.getElementById('pcount').textContent=n;
    document.getElementById('pbar').style.width=(boxes.length?n/boxes.length*100:0)+'%';
  }
  boxes.forEach(b=>{
    if(localStorage.getItem(b.dataset.key)==='1') b.checked=true;
    b.addEventListener('change',()=>{
      localStorage.setItem(b.dataset.key,b.checked?'1':'0'); upd();
    });
  });
  upd();
</script>
</body></html>
